<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAK Technologies — Business Card Front</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#C8CACD;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;
  gap:36px;padding:60px 20px;
}

.card{
  width:900px;height:514px;
  background:#FFFFFF;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  display:flex;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.05),
    0 2px 4px rgba(0,0,0,0.04),
    0 12px 28px rgba(0,0,0,0.08),
    0 48px 96px rgba(0,0,0,0.06);
}

/* ── LEFT ACCENT BAR ── */
.accent-bar{
  width:6px;
  flex-shrink:0;
  background:linear-gradient(180deg,#4F46E5 0%,#7C3AED 50%,#4F46E5 100%);
}

/* ── MAIN CONTENT ── */
.content{
  flex:1;
  padding:48px 56px 48px 52px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* ── TOP ── */
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo-wrap{
  width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;
}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}

.top-right{display:flex;align-items:center;gap:6px;}
.top-right svg{opacity:0.3;}
.top-location{font-size:12px;font-weight:400;color:#94A3B8;letter-spacing:0.2px;}

/* ── HERO ── */
.hero{display:flex;flex-direction:column;gap:8px;margin-top:-4px;}

.hero-name{
  font-size:112px;font-weight:900;
  color:#0A0F1E;
  letter-spacing:-5px;
  line-height:0.88;
}
.hero-dot{
  background:linear-gradient(135deg,#4F46E5,#7C3AED);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero-sub{
  font-size:12px;font-weight:500;
  color:#94A3B8;
  letter-spacing:6px;
  text-transform:uppercase;
}

/* ── RULE ── */
.rule{
  height:1.5px;
  width:100%;
  background:linear-gradient(90deg,#4F46E5,#7C3AED,rgba(124,58,237,0.08));
}

/* ── TAGLINE ── */
.tagline{
  font-size:22px;font-weight:700;
  color:#0A0F1E;
  letter-spacing:-0.5px;
  line-height:1.35;
  max-width:620px;
}
.tagline .muted{
  font-weight:300;font-style:italic;color:#94A3B8;
}

/* ── BOTTOM ── */
.bottom{display:flex;align-items:flex-end;justify-content:space-between;}

.services{display:flex;flex-direction:column;gap:7px;}
.services-label{
  font-size:9.5px;font-weight:700;color:#CBD5E1;
  letter-spacing:2.5px;text-transform:uppercase;
}
.services-list{
  font-size:13px;font-weight:500;color:#475569;
  line-height:1.6;
}
.services-list .dot{color:#C7D2E0;margin:0 5px;}

.bottom-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.price-from{font-size:9.5px;font-weight:700;color:#CBD5E1;letter-spacing:1.5px;text-transform:uppercase;}
.price-amt{
  font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1;
  background:linear-gradient(135deg,#4F46E5,#7C3AED);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.price-url{font-size:11px;font-weight:400;color:#94A3B8;margin-top:3px;}

/* ── DOWNLOAD ── */
.dl-btn{
  background:#0A0F1E;color:#fff;border:none;
  padding:14px 40px;border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;letter-spacing:0.2px;
  box-shadow:0 4px 16px rgba(0,0,0,0.18);
  transition:transform .18s,background .18s;
}
.dl-btn:hover{background:#1E293B;transform:translateY(-1px);}
.dl-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
</style>
</head>
<body>

<div class="card" id="poster">

  <!-- ACCENT BAR -->
  <div class="accent-bar"></div>

  <!-- CONTENT -->
  <div class="content">

    <!-- TOP: logo only + location -->
    <div class="top">
      <div class="logo-wrap"><img class="brand-logo" alt="RAK Technologies"></div>
      <div class="top-right">
        <svg width="10" height="12" viewBox="0 0 10 12" fill="none">
          <path d="M5 0C2.79 0 1 1.79 1 4c0 3 4 8 4 8s4-5 4-8c0-2.21-1.79-4-4-4zm0 5.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="#94A3B8"/>
        </svg>
        <div class="top-location">South Africa</div>
      </div>
    </div>

    <!-- HERO -->
    <div class="hero">
      <div class="hero-name">RAK<span class="hero-dot">.</span></div>
      <div class="hero-sub">Technologies</div>
    </div>

    <!-- RULE -->
    <div class="rule"></div>

    <!-- TAGLINE -->
    <div class="tagline">
      If it's Tech, <span class="muted">Trust Us</span> &mdash; We can Build it.
    </div>

    <!-- BOTTOM -->
    <div class="bottom">
      <div class="services">
        <div class="services-label">What we build</div>
        <div class="services-list">
          Web Design<span class="dot">&middot;</span>CRM Systems<span class="dot">&middot;</span>WhatsApp Automation<br>
          AI Integration<span class="dot">&middot;</span>Custom Software
        </div>
      </div>
      <div class="bottom-right">
        <div class="price-from">Websites from</div>
        <div class="price-amt">R4,500</div>
        <div class="price-url">www.raktechnologies.co.za</div>
      </div>
    </div>

  </div>
</div>

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.brand-logo').forEach(function(img){ img.src = LOGO_SRC; });
});
function downloadPoster() {
  var btn = document.getElementById('dlBtn');
  var orig = btn.innerHTML;
  btn.textContent = 'Generating…'; btn.disabled = true;
  var gradEls = document.querySelectorAll('.hero-dot,.price-amt');
  gradEls.forEach(function(el){
    el.style.webkitTextFillColor='#5B52E8';
    el.style.webkitBackgroundClip='unset';
    el.style.backgroundClip='unset';
    el.style.background='none';
  });
  html2canvas(document.getElementById('poster'),{
    scale:2,useCORS:true,allowTaint:true,logging:false,imageTimeout:0
  }).then(function(canvas){
    gradEls.forEach(function(el){
      el.style.webkitTextFillColor='';
      el.style.webkitBackgroundClip='';
      el.style.backgroundClip='';
      el.style.background='';
    });
    canvas.toBlob(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download='rak-business-card-front.png';
      document.body.appendChild(a);a.click();
      document.body.removeChild(a);URL.revokeObjectURL(url);
      btn.innerHTML=orig;btn.disabled=false;
    },'image/png');
  }).catch(function(){
    gradEls.forEach(function(el){
      el.style.webkitTextFillColor='';
      el.style.webkitBackgroundClip='';
      el.style.backgroundClip='';
      el.style.background='';
    });
    btn.textContent='Failed — try in Chrome';btn.disabled=false;
    setTimeout(function(){btn.innerHTML=orig;},3000);
  });
}
